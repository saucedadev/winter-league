<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Winter League</title>
    <script>
      // First-paint theme from cache (no flash); the theme store reconciles
      // with the server's sitewide setting right after mount.
      try {
        var t = localStorage.getItem('winterleague:theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark' || t === 'midnightNoir' || t === 'midnightPacific') document.documentElement.classList.add('dark');
        // First-paint app name from cache, so a renamed conference never flashes the default.
        var b = JSON.parse(localStorage.getItem('winterleague:branding') || '{}');
        if (b.appName) document.title = b.appName;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
